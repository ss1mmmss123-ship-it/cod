version: '3.9'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: durak
      POSTGRES_PASSWORD: durak
      POSTGRES_DB: durak
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ['6379:6379']

  backend:
    build: ../backend
    env_file: ../.env
    ports: ['4000:4000']
    depends_on: [postgres, redis]

  frontend:
    build: ../frontend
    ports: ['5173:5173']
    depends_on: [backend]

volumes:
  pgdata:
